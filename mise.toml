# oinam.dev: tools and tasks for local development.
# First time: `mise trust` (once per clone), then `mise install`. Everything else is
# `mise run <task>`; `mise tasks` lists them.

[tools]
# Node runs the linters, the formatter, and the tests. Wrangler serves public/ locally the way
# Cloudflare Pages does, with the headers and the 404 page.
node = "22"
"npm:wrangler" = "4.159.0"
# For install.sh, the one shell script: its linter and its formatter.
shellcheck = "0.11.0"
shfmt = "3.14.1"

[env]
HOST = "127.0.0.1"
PORT = "8788"
# The linters and the formatter are npm packages; this puts them on the PATH for the tasks.
_.path = ["node_modules/.bin"]

[tasks.install]
description = "Install the linters and the formatter (skipped when nothing changed)"
run = "npm install"
sources = ["package.json", "package-lock.json"]
outputs = ["node_modules/.package-lock.json"]

[tasks.dev]
description = "Serve the site at http://127.0.0.1:8788, and open it"
run = """
if [ "${OPEN:-1}" != "0" ]; then (sleep 2 && open "http://{{env.HOST}}:{{env.PORT}}") & fi
wrangler pages dev public --ip {{env.HOST}} --port {{env.PORT}}
"""

[tasks.format]
description = "Format everything with Prettier, and the installer with shfmt"
depends = ["install"]
run = ["prettier --write .", "shfmt --write --indent 2 public/ui/install.sh"]

[tasks.lint]
description = "Lint the scripts (ESLint), the styles (Stylelint), the pages (html-validate), and the installer (ShellCheck)"
depends = ["install"]
run = [
  "eslint .",
  "stylelint 'public/**/*.css'",
  "html-validate 'public/**/*.html'",
  "shellcheck public/ui/install.sh",
]

[tasks.test]
description = "Run the test suite with Node's test runner"
run = "node --test"

[tasks.eval]
description = "Have an agent build each brief in evals/ and score the pages. Spends the agent's tokens"
run = "node evals/run.js"

[tasks.check]
description = "Everything CI runs: the format check, the linters, and the tests"
depends = ["install"]
run = [
  "prettier --check .",
  "shfmt --diff --indent 2 public/ui/install.sh",
  { task = "lint" },
  { task = "test" },
]

[tasks.release]
description = "Freeze this version's stylesheets, scripts, and fonts in public/ui/releases/<version>/"
run = "node scripts/release.js"

[tasks.colors]
description = "Write the color pages in public/colors/ from public/colors/colors.json"
run = "node scripts/colors.js"

[tasks.icons]
description = "Copy Phosphor's icons into public/ui/icons/ from an unpacked package (see scripts/icons.js)"
run = "node scripts/icons.js"

[tasks.social-card]
description = "Draw the picture shown when a link to the site is shared, from docs/social-card.html"
run = """
CHROME="${CHROME_PATH:-/Applications/Google Chrome.app/Contents/MacOS/Google Chrome}"
"$CHROME" --headless --disable-gpu --hide-scrollbars --allow-file-access-from-files \
  --force-device-scale-factor=1 --window-size=1200,630 \
  --screenshot=public/assets/www.oinam.dev.png "file://$PWD/docs/social-card.html"
"""
