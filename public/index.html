<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Oinam.DEV</title>
<meta name="description" content="Design, and development assets, ideas, standards, for AI, and their agents, tools, harnesses, and all the shebang.">

<style>
  :root {
    /* Tailwind inspired */
    --color-zinc-50: #fafafa;
    --color-zinc-100: #f4f4f5;
    --color-zinc-200: #e4e4e7;
    --color-zinc-700: #3f3f46;

    --font-family-serif: 'Iowan Old Style', 'Apple Garamond', Baskerville, 'Times New Roman', 'Droid Serif', Times, 'Source Serif Pro', serif;

    --border-radius: 13px;
  }

  html {
    background: var(--color-zinc-100);
  }

  body {
    margin: auto;
    width: 90%;
    max-width: 600px;
    font-family: var(--font-family-serif);
    font-size: 18px;
    line-height: 1.6;
    color: var(--color-zinc-700);

    /* vertical center */
    display: grid;
    min-height: 100vh;
    place-content: center;
  }

  h1 {
    margin: 0;
    padding: 2rem;
    font-size: 1.6rem;
  }

  p {
    font-size: 1rem;
  }

  a {
    color: inherit;
  }

  main {
    padding: 1.6rem 2rem;
    background: var(--color-zinc-50);
    box-shadow: 0 10px 20px var(--color-zinc-200);
    border-radius: var(--border-radius);
  }

</style>

</head>

<body>

  <h1>Oinam.DEV</h1>
  <main>
    <p>Coming soon.</p>
    <p>
      Design, and development assets, ideas, and standards for AI, and their
      agents, tools, and harnesses, for the Internet Assets at
      <a href="https://oinam.com">Oinam</a>.
    </p>
    <p>
      Source at
      <a href="https://github.com/oinam/oinam.dev">github.com/oinam/oinam.dev</a>.
    </p>
  </main>

</body>
</html>
