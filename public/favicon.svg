<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <title>Oinam</title>
  <!--
    The Oinam mark: a slashed O, the sign for a diameter, cut out of a square.

    It is drawn from its geometry, as measured from the original artwork. The O
    is two ellipses about the center of a 600 by 600 square: its outside is 252.4
    by 196.5, turned 114.9 degrees, and its counter is 224.5 by 106.5, turned 105
    degrees. The slash is a bar 69.4 wide through the center, rising at 49.7
    degrees. The four paths are what is left of the square: a corner on each side
    of the slash, and the two halves of the counter.
  -->
  <rect width="600" height="600" fill="#f4f4f4" />
  <g fill="#323232">
    <path d="M0.08 600L119.87 458.75A252.4 196.5 114.9 0 1 434.34 87.94L508.92 0L0 0L0 600Z" />
    <path d="M181.87 385.65A224.5 106.5 105 0 1 401.87 126.23Z" />
    <path d="M91.08 600L165.66 512.06A252.4 196.5 114.9 0 0 480.13 141.25L599.92 0L600 0L600 600Z" />
    <path d="M198.13 473.77A224.5 106.5 105 0 0 418.13 214.35Z" />
  </g>
</svg>
